name: Contracts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundry:
    # Dependency restore is pinned to exact release tags (verified: forge build
    # + all 80 tests pass against them), so the job is deterministic and safe
    # to run on every push instead of manual-only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Restore Foundry dependencies
        run: |
          rm -rf lib
          mkdir -p lib
          git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable lib/openzeppelin-contracts-upgradeable
          git clone --depth 1 --branch v0.1.22 https://github.com/Vectorized/solady lib/solady
      - run: forge build
      - run: forge test

  analyzers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore Foundry dependencies
        run: |
          rm -rf lib
          mkdir -p lib
          git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable lib/openzeppelin-contracts-upgradeable
          git clone --depth 1 --branch v0.1.22 https://github.com/Vectorized/solady lib/solady
      - run: pipx install slither-analyzer
      - run: slither . || true
      - run: pipx install mythril
      - run: myth analyze src/GuardedWallet.sol || true
