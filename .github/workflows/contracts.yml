name: Contracts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundry:
    # Third-party actions are pinned to immutable commits.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1
      - name: Restore Foundry dependencies
        run: scripts/restore-foundry-deps.sh
      - run: forge build
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci

  analyzers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1
      - name: Restore Foundry dependencies
        run: scripts/restore-foundry-deps.sh
      - run: pipx install slither-analyzer==0.10.4
      - run: slither . --fail-high --filter-paths "lib/|test/|script/"
