name: Docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snippets --workspace @arcanum/docs
      - run: npm run typecheck --workspace @arcanum/docs
      # The public /docs route is built by @arcanum/web in the main CI job.
      # Build-only check for the docs app.
