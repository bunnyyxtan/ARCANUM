name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm test --workspace @arcanum/sdk
      - run: npm run build:publish --workspace @arcanum/sdk
      - run: npm pack --dry-run --json ./packages/sdk/dist-publish
      - run: uv build
        working-directory: packages/sdk-py
      - uses: actions/upload-artifact@v4
        with:
          name: arcanum-sdk-npm
          path: packages/sdk/dist-publish
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arcanum-sdk-pypi
          path: packages/sdk-py/dist
          if-no-files-found: error
