# Copy this file to .github/workflows/indexer-topup.yml via the GitHub web UI.
#
# Replit's GitHub connection is not allowed to push workflow files, so this
# lives in docs/ and has to be placed by hand once. See docs/INDEXER-TOPUP.md
# for the three repository secrets it needs.
#
# What it does: every 3 hours, run the Ponder indexer just long enough to catch
# the read model up to the chain tip, then stop. The checkpoint lives in the
# `ponder_app` schema of the Supabase database, so each run resumes where the
# previous one stopped -- nothing is re-indexed. Stopping at a timeout is the
# expected way for the run to end; Ponder has no "reached the tip, exit" mode.

name: Indexer top-up

on:
  schedule:
    # Every 3 hours keeps a month comfortably inside GitHub's 2000 free
    # minutes for private repositories. The odd minute avoids the herd of
    # jobs the whole world schedules at :00.
    - cron: "23 */3 * * *"
  workflow_dispatch:

concurrency:
  group: indexer-topup
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Index until the chain tip, then stop
        env:
          DATABASE_URL: ${{ secrets.INDEXER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_TESTNET_RPC: https://arc-testnet.drpc.org
          # The legacy drizzle Postgres mirror only exists in the Replit dev
          # database; here the handlers stop after their Supabase sync.
          ARCANUM_DISABLE_PG_MIRROR: "1"
        run: |
          set +e
          run_indexer() {
            timeout --signal=SIGINT --kill-after=30 600 \
              npm run start --workspace @arcanum/indexer 2>&1 | tee /tmp/indexer.log
            return "${PIPESTATUS[0]}"
          }
          run_indexer; code=$?
          # A new indexer build cannot reuse the bookkeeping schema the old
          # build left behind. Nothing durable lives there -- the RPC cache
          # (ponder_sync) and the Supabase read model both survive -- so reset
          # it and run once more.
          if grep -q "previously used by a different Ponder app" /tmp/indexer.log; then
            echo "new indexer build detected -- resetting the bookkeeping schema"
            if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "drop schema if exists ponder_app cascade;"; then
              echo "schema reset failed -- refusing to retry against a stale schema"
              exit 1
            fi
            run_indexer; code=$?
          fi
          # 124 = the timeout stopped it (expected), 130 = clean SIGINT exit.
          if [ "$code" = "124" ] || [ "$code" = "130" ] || [ "$code" = "0" ]; then
            echo "top-up finished (exit $code)"
            exit 0
          fi
          exit "$code"
